<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauntlet progress</title>
<style>
  :root { --bg:#f6f0e2; --card:#fffaf0; --ink:#2b2115; --dim:#7a6a52; --line:#e2d6bd; --win:#2f7d4f; --lose:#b5432f; --run:#b9831d; --idle:#9a8e78; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1710; --card:#2a2217; --ink:#f1e7d0; --dim:#b3a58b; --line:#403524; --win:#6fcf97; --lose:#ef8a73; --run:#f2b441; --idle:#8d826b; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 24px 60px; font:15px/1.45 system-ui,'Segoe UI',sans-serif; color:var(--ink); background:var(--bg); }
  h1 { font:600 24px/1.2 Georgia,serif; margin:0 0 4px; }
  .sub { color:var(--dim); margin:0 0 18px; }
  .bar { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 14px; }
  .stat b { display:block; font:600 22px Georgia,serif; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:14px; }
  .piece { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .piece h2 { margin:0 0 2px; font:600 17px Georgia,serif; display:flex; justify-content:space-between; gap:10px; }
  .tag { font:600 11px system-ui; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:10px; border:1px solid currentColor; align-self:center; white-space:nowrap; }
  .win { color:var(--win) } .lose { color:var(--lose) } .run { color:var(--run) } .idle { color:var(--idle) }
  .gap { margin:8px 0 0; font-size:13.5px; }
  .gap em { color:var(--dim); font-style:normal; }
  .rounds { margin:10px 0 0; padding:0; list-style:none; font-size:12.5px; color:var(--dim); }
  .rounds li { padding:3px 0; border-top:1px dashed var(--line); }
  .log { margin-top:22px; }
  .log h2 { font:600 17px Georgia,serif; }
  .log ol { padding-left:20px; color:var(--dim); font-size:13.5px; }
  .stamp { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<h1>Timeline, pins and marching flags: gauntlet</h1>
<p class="sub">Bar: American Battlefield Trust, <em>Gettysburg: Animated Battle Map</em>. A builder and a blind critic per piece, looping until the critic picks ours. <span class="stamp" id="stamp"></span></p>
<div class="bar" id="stats"></div>
<div class="grid" id="grid"></div>
<div class="log"><h2>Log</h2><ol id="log"></ol></div>
<script>
const label = { win:'ours wins blind', lose:'ours loses', run:'working', idle:'waiting' };
function render(d){
  document.getElementById('stamp').textContent = 'Updated ' + d.updated + ' (refreshes every 5 s)';
  const n = d.pieces.filter(p=>!p.label).length, w = d.pieces.filter(p=>p.status==='win' && !p.label).length;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${w}/${n}</b>pieces won blind (of ${d.pieces.filter(p=>!p.label).length} judged)</div>` +
    `<div class="stat"><b>${d.pieces.reduce((a,p)=>a+p.rounds.length,0)}</b>critic rounds so far</div>` +
    `<div class="stat"><b>${d.tests}</b>tests</div>`;
  document.getElementById('grid').innerHTML = d.pieces.map(p => `
    <section class="piece">
      <h2>${p.name}<span class="tag ${p.status}">${p.label || label[p.status]}</span></h2>
      <div class="gap"><em>Biggest remaining gap:</em> ${p.gap || 'none open'}</div>
      <ul class="rounds">${p.rounds.map(r=>`<li><b>Round ${r.n}</b>: ${r.verdict}</li>`).join('') || '<li>No round yet</li>'}</ul>
    </section>`).join('');
  document.getElementById('log').innerHTML = d.log.map(l=>`<li>${l}</li>`).join('');
}
async function tick(){
  try { const r = await fetch('data.json?'+Date.now()); render(await r.json()); } catch(e) { document.getElementById('stamp').textContent = 'waiting for data...'; }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
